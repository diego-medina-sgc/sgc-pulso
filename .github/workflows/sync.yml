name: Sync con Drive

# El indice de Drive, cada hora.
#
# POR QUE ACA (22/9/2026)
#
# Corria en el repo privado, una vez por dia a las 9. John subio albumes nuevos
# a la unidad "Multimedia Drive" y Diego los fue a buscar a la app el mismo dia:
# "hace que se actualicen mas frecuentemente para que se vayan viendo a medida
# que se cargan". Cada hora en el repo privado son unos 200 minutos por dia
# contra los 2.000 por mes que regala GitHub: se pagaria. Aca los minutos de un
# repo publico no se cobran, que es la misma razon por la que el pulso vive
# aca.
#
# SEGURIDAD: igual que el pulso. Solo arranca por horario o a mano, ningun
# disparador corre codigo de un pull request, y los pull requests de terceros
# no reciben los secretos. El sync no baja ninguna foto: lee nombres de
# carpetas y metadatos, y escribe en Supabase. La salida publica del resumen
# puede tener nombres de carpetas, asi que no se publica: queda en el log del
# runner.
#
# Usa la Changes API: pide solo lo que cambio desde la ultima vez en vez de
# recorrer las 9.093 carpetas. Una corrida sin novedades tarda segundos, que es
# lo que hace que correrlo cada hora no cueste nada.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'Solo fijar el token de arranque, sin sincronizar'
        type: boolean
        default: false
      dry_run:
        description: 'Mostrar que haria, sin escribir'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: drive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: build/requirements-sync.txt

      - name: Instalar dependencias
        run: pip install --quiet -r build/requirements-sync.txt

      - name: Escribir el service account
        env:
          DRIVE_SERVICE_ACCOUNT: ${{ secrets.DRIVE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$DRIVE_SERVICE_ACCOUNT" ]; then
            echo "Falta el secret DRIVE_SERVICE_ACCOUNT"; exit 1
          fi
          umask 077
          printf '%s' "$DRIVE_SERVICE_ACCOUNT" > build/service-account.json
          python -c "import json;json.load(open('build/service-account.json'));print('service account OK')"

      - name: Sincronizar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # por variable y no pegado en el script: el valor no se interpreta
          BOOTSTRAP: ${{ inputs.bootstrap }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=""
          if [ "$BOOTSTRAP" = "true" ]; then ARGS="--bootstrap"; fi
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python build/sync_drive.py $ARGS

      - name: Limpiar credenciales
        if: always()
        run: rm -f build/service-account.json
